name: Update news

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # rebuild right away when the site's settings change
    branches: [main]
    paths-ignore: ["index.html", "moments.json"]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Save the new page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html moments.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          git pull --rebase origin main
          git push
