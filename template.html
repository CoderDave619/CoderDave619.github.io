<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrestling News Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap">
  <style>
    :root { color-scheme: dark; --display: "Anton", Impact, "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif; --bg: #0e0e0e; --card: #1a1a1a; --text: #f2f2f2; --muted: #9a9a9a; --accent: #e0b23a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--body); background: var(--bg); color: var(--text); }
    header { padding: 10px 16px 6px; text-align: center; border-bottom: 3px solid var(--accent); }
    h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 5vw, var(--title-size)); letter-spacing: 2px; text-transform: uppercase; }
    /* The columns and what sits in them come from layout.json (set with the layout editor). */
    .layout { max-width: var(--page-w, 1200px); margin: 0 auto; padding: 14px 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav a { background: var(--card); color: var(--text); border: 2px solid var(--c, #444); border-radius: 999px; padding: 6px 14px; text-decoration: none; font-weight: 600; }
    nav a:hover { background: var(--c, #444); }
    .count { opacity: 0.7; font-size: 0.8rem; font-weight: 400; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 2px; border-bottom: 1px solid #2a2a2a; }
    li:last-child { border-bottom: none; }
    li a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.05rem; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    li a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .major { display: table; background: var(--c, var(--accent)); color: #fff; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 3px; padding: 1px 6px; margin-bottom: 3px; }
    .featured li.is-major a { font-size: calc(var(--headline-size) * 1.12); }
    .tag { background: #333; color: var(--accent); border-radius: 4px; padding: 1px 6px; margin-left: 4px; font-size: 0.72rem; }

    /* Themed sections for featured companies; colors come from companies.json */
    .grid { display: grid; grid-template-columns: var(--cols, 1fr 1fr 1fr 1fr); gap: 12px; margin-top: 12px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .col > * { margin-top: 0; margin-bottom: 0; }
    /* On big screens the two pinned sections scroll inside themselves, so the whole home page fits on one screen. */
    @media (min-width: 701px) { .featured.big ul { max-height: calc(100vh - 230px); overflow-y: auto; } }
    .featured.big .banner { padding: 8px 12px; }
    .featured.small .banner { padding: 3px 12px; }
    .featured.small h2 { font-size: calc(var(--company-size) * 0.95); }
    /* On shorter screens the stacked sections show only their top story, so they all still fit. */
    @media (min-width: 701px) and (max-height: 900px) { .featured.small li:nth-child(n+2) { display: none; } }
    .featured.big h2 { font-size: calc(var(--company-size) * 1.35); }
    .featured { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid #2a2a2a; scroll-margin-top: 12px; min-width: 0; }
    .featured .banner { background: linear-gradient(120deg, var(--b1, var(--c)), var(--b2, var(--c2))); color: var(--bt, #fff); padding: 5px 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .featured h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: var(--company-size); letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .featured .banner span { font-weight: 600; font-size: 0.78rem; opacity: 0.9; }
    .featured .banner h2 { color: var(--bn, inherit); }
    .featured .banner h2.has-logo { line-height: 0; }
    .featured .banner:has(.has-logo) { align-items: center; }
    .featured .banner .logo { display: block; height: 40px; width: auto; border-radius: 3px; }
    .featured.small .banner .logo { height: 32px; }
    .featured[style*="--bb"] .banner { box-shadow: inset 0 0 0 2px var(--bb); }
    .featured ul { padding: 0 12px 4px; }
    .featured li { padding: 6px 0; }
    .featured li a { font-size: var(--headline-size); line-height: 1.25; }
    .featured .meta { font-size: 0.75rem; }
    .featured li a:hover { color: var(--c); }

    /* Moments: rotating photos from the biggest stories of the last 30 days */
    .moments { margin: 0; }
    .moments h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.8rem; margin-left: 6px; }
    .moments .slides { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--card); }
    .moments .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s; color: #fff; text-decoration: none; pointer-events: none; }
    .moments .slide.on { opacity: 1; pointer-events: auto; }
    .moments img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .moments .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 8px; border-left: 4px solid var(--c);
                    background: linear-gradient(transparent, rgba(0,0,0,0.88) 45%); }
    .moments .cap b { display: block; font-size: 0.88rem; line-height: 1.25; }
    .moments .cap small { color: #bbb; font-size: 0.72rem; }
    .moments .slide:hover b { text-decoration: underline; }
    .moments .dots { display: flex; justify-content: center; gap: 6px; margin-top: 7px; }
    .moments .dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: #555; cursor: pointer; }
    .moments .dots button.on { background: var(--accent); }
    .featured .banner:has(.has-logo) { justify-content: center; }
    /* Upcoming shows with their announced matches, filled from schedule.json and the news */
    .upcoming ol { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 8px; border: 1px solid #2a2a2a; }
    .upcoming ol > li { display: grid; grid-template-columns: 66px 1fr; gap: 6px; padding: 7px 10px; border-left: 4px solid var(--c); border-bottom: 1px solid #2a2a2a; }
    .upcoming ol > li:last-child { border-bottom: none; }
    .upcoming time { color: var(--muted); font-size: 0.74rem; font-weight: 600; line-height: 1.3; padding-top: 2px; }
    .upcoming b { font-size: 0.9rem; color: var(--c); filter: brightness(1.25); }
    .upcoming li.event b { font-size: 0.98rem; }
    .upcoming i { font-style: normal; font-size: 0.6rem; font-weight: 700; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 5px; color: var(--accent); vertical-align: 2px; }
    .upcoming small { color: var(--muted); font-size: 0.74rem; }
    .upcoming ul { margin: 3px 0 0; padding: 0; }
    .upcoming ul li { padding: 1px 0; border: none; font-size: 0.8rem; font-weight: 600; }
    .upcoming ul li::before { content: "• "; color: var(--c); }
    .upcoming small.none { display: block; font-style: italic; }
    /* Post of the day box, filled from spotlight.json */
    .spotlight { margin: 0; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; }
    .spotlight figcaption { font-family: var(--display); color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 1.05rem; }
    .spotlight blockquote { margin: 8px 0; font-size: 0.95rem; font-style: italic; line-height: 1.4; }
    .spotlight a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
    .spotlight a:hover { color: var(--accent); }

    /* The Numbers ticker: viewers, PPV buys and tickets pulled from headlines */
    .ticker { display: flex; align-items: stretch; background: #151515; border-bottom: 1px solid #2a2a2a; overflow: hidden; }
    .ticker-label { flex: none; display: flex; align-items: center; padding: 0 10px; background: var(--accent); color: #111; font-family: var(--display); text-transform: uppercase; letter-spacing: 1px; font-size: 0.68rem; }
    .ticker-window { flex: 1; min-width: 0; overflow: hidden; }
    .ticker-track { display: inline-flex; white-space: nowrap; animation: ticker var(--speed) linear infinite; }
    .ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
    .ticker-copy { display: inline-flex; }
    .tick { display: inline-flex; align-items: baseline; gap: 10px; padding: 4px 15px; border-right: 1px solid #2a2a2a; font-size: 0.66rem; }
    /* Each show's name and stripe use its own color from showColors in companies.json. */
    .tick strong { font-weight: 700; letter-spacing: 0.3px; color: var(--c); filter: brightness(1.25); border-left: 3px solid var(--c); padding-left: 6px; }
    .tick .m { color: var(--text); text-decoration: none; }
    /* Gate is money green; tickets, viewers and buys stay white. */
    .tick .gate b { color: #4fbf6a; }
    .tick .missing b { color: #5c5a55; font-weight: 400; }
    .tick i { font-style: normal; font-size: 0.48rem; font-weight: 700; letter-spacing: 1px; border: 1px solid var(--c); border-radius: 3px; padding: 0 3px; margin-left: -4px; }
    .tick .m:hover b { text-decoration: underline; }
    .tick b { font-family: var(--body); font-weight: 600; font-size: 0.82rem; font-variant-numeric: tabular-nums; color: #ece8df; }
    .tick small { color: #a89a74; font-size: 0.6rem; letter-spacing: 0.3px; }
    
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .ticker-window { overflow-x: auto; }
      .ticker-track { animation: none; }
      .ticker-copy { display: none; }
    }

    /* Sidebar for smaller companies */
    .col h3 { margin: 4px 0 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-size: 0.95rem; }
    details { background: var(--card); border-left: 4px solid var(--c, #555); border-radius: 6px; margin-bottom: 10px; padding: 8px 12px; scroll-margin-top: 12px; }
    summary { cursor: pointer; font-weight: 700; }
    details li a { font-size: 0.92rem; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  </style>
  {{LAYOUT_VARS}}
</head>
<body>
  <header>
    <h1>Wrestling News Daily</h1>
    <p class="meta">Updated {{UPDATED}}</p>
  </header>
  {{NUMBERS}}
  <div class="layout">
    <nav>{{NAV}}</nav>
    {{NOTE}}
{{SECTIONS}}
  </div>
  <script>
    // Moments slideshow: show the next photo every few seconds, pause while the mouse is over it.
    document.querySelectorAll(".moments").forEach(box => {
      const wait = (Number(box.dataset.seconds) || 6) * 1000;
      const dots = box.querySelector(".dots");
      let i = 0, paused = false;
      const slides = () => [...box.querySelectorAll(".slide")];
      function show(n) {
        const all = slides();
        if (!all.length) { box.remove(); return; }
        i = (n + all.length) % all.length;
        all.forEach((s, k) => s.classList.toggle("on", k === i));
        dots.innerHTML = all.length > 1 ? all.map((_, k) => `<button class="${k === i ? "on" : ""}" aria-label="Photo ${k + 1}"></button>`).join("") : "";
        dots.querySelectorAll("button").forEach((b, k) => b.onclick = () => show(k));
      }
      box.addEventListener("mouseenter", () => paused = true);
      box.addEventListener("mouseleave", () => paused = false);
      setInterval(() => { if (!paused) show(i + 1); }, wait);
      // Photos that fail to load remove themselves, so recount once the page has loaded.
      show(0); window.addEventListener("load", () => show(i));
    });
  </script>
</body>
</html>
